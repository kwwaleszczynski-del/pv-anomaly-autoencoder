[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-anomaly-autoencoder"
version = "0.1.0"
description = "Fault detection for PV plants: a PyTorch autoencoder versus simple statistical and physical baselines on simulated data with labelled faults."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pvlib>=0.11",
    "torch>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pv-anomaly = "pv_anomaly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning"]
